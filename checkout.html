<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarGazing – Checkout</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Global fixed night-sky starfield background (generated by main.js) -->
  <div class="night-sky" id="nightSky"></div>

  <!-- NAV -->
  <nav aria-label="Main navigation">
    <div class="nav-brand">
      <a href="index.html">
        <svg viewBox="0 0 60 60" width="38" height="38" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </a>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="cart-link">
        Cart
        <span class="cart-badge" id="cartBadge" aria-live="polite" aria-atomic="true"></span>
      </a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <section class="section checkout-section">
      <div class="checkout-layout">

        <!-- Shipping Details Form -->
        <form id="checkoutForm" novalidate>
          <h2 class="display">Shipping Details</h2>

          <div class="field-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" required autocomplete="name">
            <span class="field-error" id="fullNameError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="streetAddress">Street Address</label>
            <input id="streetAddress" name="streetAddress" type="text" required autocomplete="street-address">
            <span class="field-error" id="streetAddressError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="city">City</label>
            <input id="city" name="city" type="text" required autocomplete="address-level2">
            <span class="field-error" id="cityError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="province">Province</label>
            <input id="province" name="province" type="text" required autocomplete="address-level1">
            <span class="field-error" id="provinceError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="postalCode">Postal Code</label>
            <input id="postalCode" name="postalCode" type="text" required autocomplete="postal-code">
            <span class="field-error" id="postalCodeError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <span class="field-error" id="emailError" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" required autocomplete="tel">
            <span class="field-error" id="phoneError" aria-live="polite"></span>
          </div>

          <button type="submit" id="placeOrderBtn" class="btn">Place Order</button>
        </form>

        <!-- Order Summary -->
        <aside class="order-summary" aria-label="Order summary">
          <h2 class="display">Your Order</h2>
          <div id="summaryItems"></div>
          <p class="subtotal mono" id="summarySubtotal"></p>
        </aside>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 60 60" width="32" height="32" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </div>
      <div class="footer-nav">
        <div class="footer-col">
          <h4 class="mono">Shop</h4>
          <a href="shop.html?collection=astronomy">Astronomy Edition</a>
          <a href="shop.html?collection=kids">Little Explorers</a>
          <a href="shop.html?collection=wish">Wish Edition</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Brand</h4>
          <a href="about.html">About Us</a>
          <a href="index.html">Home</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Follow</h4>
          <a href="#">Instagram</a>
          <a href="#">Twitter</a>
        </div>
      </div>
      <p class="footer-copy mono">&copy; <span class="footer-year">2026</span> StarGazing. Make a Wish.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
