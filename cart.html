<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- Global fixed night-sky starfield background (generated by main.js) -->
  <div class="night-sky" id="nightSky"></div>

  <!-- Cosmic Loader — asteroid fly-by overlay, hidden once the page has loaded -->
  <div id="cosmicLoader" class="cosmic-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="asteroid">
      <span class="asteroid-crater crater-1"></span>
      <span class="asteroid-crater crater-2"></span>
      <span class="asteroid-crater crater-3"></span>
    </div>
  </div>

  <!-- NAV -->
  <nav aria-label="Main navigation">
    <div class="nav-brand">
      <a href="index.html">
        <svg viewBox="0 0 60 60" width="38" height="38" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </a>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="cart-link">
        Cart

      </a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <section class="cart-section">
      <div id="cartContent">
        <!-- populated by cart-page.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 60 60" width="32" height="32" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>

      <div class="footer-nav">
        <div class="footer-col">
          <h4 class="mono">Shop</h4>
          <a href="shop.html?collection=astronomy">Astronomy Edition</a>
          <a href="shop.html?collection=kids">Little Explorers</a>

        </div>
        <div class="footer-col">
          <h4 class="mono">Brand</h4>
          <a href="about.html">About Us</a>
          <a href="index.html">Home</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Follow</h4>
          <a href="https://www.instagram.com/stargazing_apparel_/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://www.tiktok.com/@stargazing_72" target="_blank" rel="noopener noreferrer">TikTok</a>
          <a href="https://x.com/STAR6tx9" target="_blank" rel="noopener noreferrer">X</a>
        </div>
      </div>
      <p class="footer-copy mono">&copy; <span class="footer-year">2026</span> StarGazing. Make a Wish.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
