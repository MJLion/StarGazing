<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarGazing – Product</title>
  <meta name="description" content="Space-inspired apparel from StarGazing, a South African clothing brand for everyone who looks up.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StarGazing">
  <meta property="og:title" content="StarGazing">
  <meta property="og:description" content="Space-inspired apparel from StarGazing, a South African clothing brand for everyone who looks up.">
  <meta property="og:image" content="https://www.stargazingshop.co.za/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_ZA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="StarGazing">
  <meta name="twitter:description" content="Space-inspired apparel from StarGazing, a South African clothing brand for everyone who looks up.">
  <meta name="twitter:image" content="https://www.stargazingshop.co.za/images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Global fixed night-sky starfield background (generated by main.js) -->
  <div class="night-sky" id="nightSky"></div>

  <!-- Cosmic Loader — asteroid fly-by overlay, hidden once the page has loaded -->
  <div id="cosmicLoader" class="cosmic-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="asteroid">
      <span class="asteroid-crater crater-1"></span>
      <span class="asteroid-crater crater-2"></span>
      <span class="asteroid-crater crater-3"></span>
    </div>
  </div>

  <!-- NAV -->
  <nav aria-label="Main navigation">
    <div class="nav-brand">
      <a href="index.html">
        <svg viewBox="0 0 60 60" width="38" height="38" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </a>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="cart-link">
        Cart
        <span class="cart-badge" id="cartBadge" aria-live="polite" aria-atomic="true"></span>
      </a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <section class="product-detail-section section">
      <div id="productDetail">
        <div class="product-images">
          <img id="primaryImage" src="/images/products/saturn-wish-tee-black.png" alt="" class="primary-image">
          <div class="thumbnail-strip" id="thumbnailStrip"></div>
        </div>
        <div class="product-info">
          <h1 id="productName" class="display"></h1>
          <p id="productPrice" class="mono product-price"></p>
          <p id="productDescription" class="product-description"></p>
          <p id="productMaterial" class="mono product-material"></p>

          <div class="swatch-group" id="swatchGroup"
            role="group" aria-label="Select colour">
          </div>
          <p id="selectedColorLabel" class="mono selected-color-label"></p>

          <div class="size-selector" id="sizeSelector"
            role="group" aria-label="Select size">
          </div>
          <p id="sizeError" class="error" aria-live="polite" hidden></p>

          <div class="qty-stepper" role="group" aria-label="Quantity">
            <button id="qtyDec" class="qty-btn" aria-label="Decrease quantity">−</button>
            <span id="qtyValue" aria-live="polite" aria-atomic="true">1</span>
            <button id="qtyInc" class="qty-btn" aria-label="Increase quantity">+</button>
          </div>

          <button id="addToCartBtn" class="btn">Add to Cart</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 60 60" width="32" height="32" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </div>
      <div class="footer-nav">
        <div class="footer-col">
          <h4 class="mono">Shop</h4>
          <a href="shop.html?collection=astronomy">Astronomy Edition</a>
          <a href="shop.html?collection=kids">Little Explorers</a>
          <a href="shop.html?collection=wish">Wish Edition</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Brand</h4>
          <a href="about.html">About Us</a>
          <a href="index.html">Home</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Follow</h4>
          <a href="#">Instagram</a>
          <a href="#">Twitter</a>
        </div>
      </div>
      <p class="footer-copy mono">&copy; <span class="footer-year">2026</span> StarGazing. Make a Wish.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
