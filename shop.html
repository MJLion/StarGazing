<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarGazing – Shop</title>
  <meta name="description" content="Shop StarGazing tees, hoodies, caps and onesies across the Astronomy Edition, Little Explorers and Wish Edition collections.">
  <link rel="canonical" href="https://www.stargazingshop.co.za/shop.html">
  <meta property="og:url" content="https://www.stargazingshop.co.za/shop.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StarGazing">
  <meta property="og:title" content="Shop All Products – StarGazing">
  <meta property="og:description" content="Shop StarGazing tees, hoodies, caps and onesies across the Astronomy Edition, Little Explorers and Wish Edition collections.">
  <meta property="og:image" content="https://www.stargazingshop.co.za/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_ZA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop All Products – StarGazing">
  <meta name="twitter:description" content="Shop StarGazing tees, hoodies, caps and onesies across the Astronomy Edition, Little Explorers and Wish Edition collections.">
  <meta name="twitter:image" content="https://www.stargazingshop.co.za/images/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Global fixed night-sky starfield background (generated by main.js) -->
  <div class="night-sky" id="nightSky"></div>

  <!-- Cosmic Loader — asteroid fly-by overlay, hidden once the page has loaded -->
  <div id="cosmicLoader" class="cosmic-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="asteroid">
      <span class="asteroid-crater crater-1"></span>
      <span class="asteroid-crater crater-2"></span>
      <span class="asteroid-crater crater-3"></span>
    </div>
  </div>

  <!-- NAV -->
  <nav aria-label="Main navigation">
    <div class="nav-brand">
      <a href="index.html">
        <svg viewBox="0 0 60 60" width="38" height="38" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </a>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="cart-link">
        Cart
        <span class="cart-badge" id="cartBadge" aria-live="polite" aria-atomic="true"></span>
      </a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>

    <!-- Page Header -->
    <section class="section-head">
      <h1 class="display">Shop All Products</h1>
    </section>

    <!-- Filter + Sort Controls -->
    <section class="shop-controls">
      <div class="filter-group" role="group" aria-label="Filter by collection">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="astronomy">Astronomy Edition</button>
        <button class="filter-btn" data-filter="kids">Little Explorers</button>
        <button class="filter-btn" data-filter="wish">Wish Edition</button>
      </div>
      <select id="sortSelect" aria-label="Sort products">
        <option value="default">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </section>

    <!-- Product Grid -->
    <div id="productGrid" class="grid"></div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 60 60" width="32" height="32" aria-hidden="true">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#f2b632" stroke-width="2"/>
          <ellipse cx="30" cy="30" rx="24" ry="8" fill="none" stroke="#1f7a72" stroke-width="1.5" transform="rotate(-14 30 30)"/>
          <circle cx="30" cy="30" r="10" fill="#f2b632"/>
        </svg>
        <span class="display">STARGAZING</span>
      </div>
      <div class="footer-nav">
        <div class="footer-col">
          <h4 class="mono">Shop</h4>
          <a href="shop.html?collection=astronomy">Astronomy Edition</a>
          <a href="shop.html?collection=kids">Little Explorers</a>
          <a href="shop.html?collection=wish">Wish Edition</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Brand</h4>
          <a href="about.html">About Us</a>
          <a href="index.html">Home</a>
        </div>
        <div class="footer-col">
          <h4 class="mono">Follow</h4>
          <a href="#">Instagram</a>
          <a href="#">Twitter</a>
        </div>
      </div>
      <p class="footer-copy mono">&copy; <span class="footer-year">2026</span> StarGazing. Make a Wish.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
